[Rainmeter]
Update=30
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=Volver a Hoy
ContextAction=[!CommandMeasure MeasureCalendarScript "ResetToday()"]
ContextTitle2=Refrescar Widget
ContextAction2=[!Refresh]
ContextTitle3=Activar Modo RGB Arcoiris
ContextAction3=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]
ContextTitle4=Color Naranja Dorado (Fijo)
ContextAction4=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,160,0,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,160,0,40" "#@#Variables.inc"][!RefreshApp]
ContextTitle5=Color Morado Neon (Fijo)
ContextAction5=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "200,80,255,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "200,80,255,40" "#@#Variables.inc"][!RefreshApp]

