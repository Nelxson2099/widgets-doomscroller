; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------

[MeasureRgbScript]
Measure=Script
ScriptFile=#@#rgb.lua

[MeasureCalendarScript]
Measure=Script
ScriptFile=#@#calendar.lua

; -------------------------------------------------------------
; METERS - CARD CONTAINER & HEADER
; -------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,290,324,14 | Fill Color #ColorBg# | Stroke Color #ColorBorder# | StrokeWidth 1
Shape2=Rectangle 15,14,260,2,1 | Fill Color #ColorAccentGlow# | StrokeWidth 0
DynamicVariables=1

[MeterHeaderTitle]
Meter=String
X=20
Y=16
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=9.5
FontWeight=700
AntiAlias=1
Text="CALENDARIO"
DynamicVariables=1

[MeterTodayBtn]
Meter=String
X=270
Y=16
StringAlign=Right
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=8
FontWeight=600
AntiAlias=1
Text="[ HOY ]"
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "ResetToday()"]
MouseOverAction=[!SetOption MeterTodayBtn FontColor "#ColorAccent#"][!Redraw]
MouseLeaveAction=[!SetOption MeterTodayBtn FontColor "#ColorTextMuted#"][!Redraw]

[MeterNavPrev]
Meter=String
X=22
Y=38
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=12
FontWeight=800
AntiAlias=1
Text="<"
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "PrevMonth()"]
MouseOverAction=[!SetOption MeterNavPrev FontColor "#ColorAccent#"][!Redraw]
MouseLeaveAction=[!SetOption MeterNavPrev FontColor "#ColorTextSecondary#"][!Redraw]

[MeterNavNext]
Meter=String
X=268
Y=38
StringAlign=Right
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=12
FontWeight=800
AntiAlias=1
Text=">"
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "NextMonth()"]
MouseOverAction=[!SetOption MeterNavNext FontColor "#ColorAccent#"][!Redraw]
MouseLeaveAction=[!SetOption MeterNavNext FontColor "#ColorTextSecondary#"][!Redraw]

[MeterMonthYearTitle]
Meter=String
X=145
Y=38
StringAlign=Center
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=10.5
FontWeight=800
AntiAlias=1
Text="#CalHeaderTitle#"
DynamicVariables=1

