[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=Refrescar Reloj Circadiano
ContextAction=[!Refresh]
ContextTitle2=Activar Modo RGB Arcoiris
ContextAction2=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]
ContextTitle3=Tema Naranja Dorado
ContextAction3=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,160,0,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,160,0,40" "#@#Variables.inc"][!RefreshApp]

[Metadata]
Name=DoomScroller Live Circadian Tracker
Author=DoomScroller / Antigravity
Information=Widget circadiano ultracompacto optimizado para cero consumo de CPU y texto ultra legible.
License=MIT
Version=2.1.0

[Variables]
@IncludeVariables=#@#Variables.inc
WakeTime=7.0
SleepTime=23.0

CircadianPhaseTitle=Cargando...
CircadianPhaseCategory=ALERTA
CircadianPhaseDesc=Calculando gradiente biologico...
CircadianPhaseColor=0,210,255
NextMilestoneTitle=--
MinutesToNext=--

MelatoninPct=0
CortisolPct=0
AdenosinePct=0
GrowthHormonePct=0
BodyTempPct=0
InsulinPct=0

; -------------------------------------------------------------
; MEASURES (Optimizado: Refresco Biologico cada 10 seg = 0% CPU)
; -------------------------------------------------------------

[MeasureRgbScript]
Measure=Script
ScriptFile=#@#rgb.lua

[MeasureCircadianScript]
Measure=Script
ScriptFile=#@#circadian.lua
UpdateDivider=10

; -------------------------------------------------------------
; METERS (Diseno Glassmorphic de Alta Legibilidad)
; -------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,340,265,14 | Fill Color #ColorBg# | Stroke Color #ColorBorder# | StrokeWidth 1
Shape2=Rectangle 15,14,310,2,1 | Fill Color #CircadianPhaseColor#,180 | StrokeWidth 0
DynamicVariables=1

; CABECERA: "RELOJ CIRCADIANO"
[MeterHeaderTitle]
Meter=String
X=20
Y=18
FontColor=#CircadianPhaseColor#,255
FontFace=#FontFamily#
FontSize=9.5
FontWeight=800
AntiAlias=1
Text="RELOJ CIRCADIANO"
DynamicVariables=1

; PANEL DE FASE ACTUAL CON PANTALLA VECTORIAL Y BADGE
[MeterPhaseCard]
Meter=Shape
Shape=Rectangle 20,42,300,78,10 | Fill Color #ColorCardBg# | Stroke Color #CircadianPhaseColor#,70 | StrokeWidth 1
Shape2=Ellipse 42,81,12 | Fill Color #CircadianPhaseColor#,30 | Stroke Color #CircadianPhaseColor#,200 | StrokeWidth 2
Shape3=Ellipse 42,81,4 | Fill Color #CircadianPhaseColor#,255 | StrokeWidth 0
DynamicVariables=1

[MeterPhaseCategory]
Meter=String
X=66
Y=50
FontColor=#CircadianPhaseColor#,255
FontFace=#FontFamily#
FontSize=7.5
FontWeight=800
AntiAlias=1
Text="FASE // #CircadianPhaseCategory#"
DynamicVariables=1

[MeterPhaseTitle]
Meter=String
X=66
Y=62
W=245
ClipString=1
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=11
FontWeight=800
AntiAlias=1
Text="#CircadianPhaseTitle#"
DynamicVariables=1

[MeterPhaseDesc]
Meter=String
X=66
Y=81
W=245
H=34
ClipString=1
FontColor=235,245,255,255
FontFace=#FontFamily#
FontSize=8.2
FontWeight=700
AntiAlias=1
Text="#CircadianPhaseDesc#"
DynamicVariables=1

; PROXIMO HITO Y TIEMPO RESTANTE
[MeterNextCard]
Meter=Shape
Shape=Rectangle 20,128,300,32,8 | Fill Color 255,255,255,10 | StrokeWidth 0
Shape2=Rectangle 28,141,6,6,1 | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1

[MeterNextLabel]
Meter=String
X=40
Y=136
FontColor=190,205,225,255
FontFace=#FontFamily#
FontSize=8
FontWeight=800
AntiAlias=1
Text="PROXIMO HITO:"

[MeterNextValue]
Meter=String
X=130
Y=136
W=120
ClipString=1
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=8
FontWeight=700
AntiAlias=1
Text="#NextMilestoneTitle#"
DynamicVariables=1

[MeterNextTimer]
Meter=String
X=310
Y=136
StringAlign=Right
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=8
FontWeight=800
AntiAlias=1
Text="en #MinutesToNext#"
DynamicVariables=1

; GRID DE BIOMETRICOS EN TIEMPO REAL (ETIQUETAS ULTRA CLARAS Y VISIBLES)
