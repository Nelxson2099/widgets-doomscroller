[Rainmeter]
Update=30
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=Refrescar Habitos
ContextAction=[!Refresh]
ContextTitle2=🌈 Activar Modo RGB Arcoiris
ContextAction2=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]
ContextTitle3=🎨 Tema Naranja Dorado
ContextAction3=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,160,0,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,160,0,40" "#@#Variables.inc"][!RefreshApp]

[Metadata]
Name=DoomScroller Daily Habit Tracker
Author=DoomScroller / Antigravity
Information=Matriz interactiva de hábitos diarios sin palabrería redundante.
License=MIT
Version=3.2.0

[Variables]
@IncludeVariables=#@#Variables.inc
@IncludeHabits=#@#HabitsData.inc
HabitsCompleted=0
HabitsPct=0%
HabitsPctRaw=0.0

; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------

[MeasureRgbScript]
Measure=Script
ScriptFile=#@#rgb.lua

[MeasureHabitsScript]
Measure=Script
ScriptFile=#@#habits.lua
UpdateDivider=1

; -------------------------------------------------------------
; METERS (Cabecera Ultra Limpia y Espaciosa)
; -------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,340,270,14 | Fill Color #ColorBg# | Stroke Color #ColorBorder# | StrokeWidth 1
Shape2=Rectangle 15,14,310,2,1 | Fill Color #ColorAccentGlow# | StrokeWidth 0
DynamicVariables=1

; CABECERA: "HABITOS DIARIOS" + CONTADOR + SELECTOR DE COLOR
[MeterHeaderTitle]
Meter=String
X=20
Y=18
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=10
FontWeight=700
AntiAlias=1
Text="HABITOS DIARIOS"
DynamicVariables=1

[MeterHabitCount]
Meter=String
X=145
Y=19
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=8.5
FontWeight=700
AntiAlias=1
Text="#HabitsCompleted# / 5"
DynamicVariables=1

; SELECTOR DE COLOR (PUNTOS + RGB)
[MeterThemeAmber]
Meter=Shape
Shape=Ellipse 205,24,4 | Fill Color 255,160,0,255 | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,160,0,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,160,0,40" "#@#Variables.inc"][!RefreshApp]
ToolTipText="Naranja Dorado"

[MeterThemeCyan]
Meter=Shape
Shape=Ellipse 220,24,4 | Fill Color 0,210,255,255 | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "0,210,255,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "0,210,255,40" "#@#Variables.inc"][!RefreshApp]
ToolTipText="Cyan Neón"

[MeterThemeGreen]
Meter=Shape
Shape=Ellipse 235,24,4 | Fill Color 0,230,120,255 | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "0,230,120,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "0,230,120,40" "#@#Variables.inc"][!RefreshApp]
ToolTipText="Verde Esmeralda"

[MeterThemePurple]
Meter=Shape
Shape=Ellipse 250,24,4 | Fill Color 200,80,255,255 | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "200,80,255,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "200,80,255,40" "#@#Variables.inc"][!RefreshApp]
ToolTipText="Púrpura Cyberpunk"

[MeterThemeRed]
Meter=Shape
Shape=Ellipse 265,24,4 | Fill Color 255,60,80,255 | StrokeWidth 0
LeftMouseUpAction=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,60,80,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,60,80,40" "#@#Variables.inc"][!RefreshApp]
ToolTipText="Rojo Carmesí"

[MeterThemeRgb]
Meter=String
X=320
Y=18
StringAlign=Right
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=8.5
FontWeight=800
AntiAlias=1
Text="RGB"
LeftMouseUpAction=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]
ToolTipText="Modo RGB Arcoíris Dinámico"
DynamicVariables=1

; BARRA DE PROGRESO GENERAL
[MeterProgressBg]
Meter=Shape
Shape=Rectangle 20,42,300,5,2 | Fill Color 40,45,60,255 | StrokeWidth 0

[MeterProgressFill]
Meter=Shape
Shape=Rectangle 20,42,(300 * #HabitsPctRaw#),5,2 | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1

; -------------------------------------------------------------
; LISTA DE HÁBITOS INTERACTIVOS
; -------------------------------------------------------------

[MeterHabit1Box]
Meter=Shape
LeftMouseUpAction=[!WriteKeyValue Variables Habit1 "(1-#Habit1#)" "#@#HabitsData.inc"][!RefreshApp]

[MeterHabit1Icon]
