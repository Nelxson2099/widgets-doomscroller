[Rainmeter]
Update=30
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=Configurar Fecha de Nacimiento
ContextAction=["#@#Variables.inc"]
ContextTitle2=Refrescar Widget
ContextAction2=[!Refresh]
ContextTitle3=🌈 Activar Modo RGB Arcoiris
ContextAction3=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]
ContextTitle4=🎨 Color Naranja Dorado (Fijo)
ContextAction4=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,160,0,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,160,0,40" "#@#Variables.inc"][!RefreshApp]

[Metadata]
Name=DoomScroller Memento Mori Widget
Author=DoomScroller / Antigravity
Information=Widget Memento Mori con Reloj en Vivo y soporte RGB Chroma.
License=MIT
Version=3.2.0

[Variables]
@IncludeVariables=#@#Variables.inc
DaysLivedFormatted=0
WeeksLivedFormatted=0
LifePctFormatted=0.0%
LifePctRaw=0.0

; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------

[MeasureRgbScript]
Measure=Script
ScriptFile=#@#rgb.lua

[MeasureMementoScript]
Measure=Script
ScriptFile=#@#memento.lua

[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureWeekOfYear]
Measure=Time
Format=%V

[MeasureDateString]
Measure=Time
Format=%d %b %Y
FormatLocale=es-ES

; -------------------------------------------------------------
; METERS
; -------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,340,250,14 | Fill Color #ColorBg# | Stroke Color #ColorBorder# | StrokeWidth 1
Shape2=Rectangle 15,14,310,2,1 | Fill Color #ColorAccentGlow# | StrokeWidth 0
DynamicVariables=1

[MeterHeaderTitle]
Meter=String
X=20
Y=20
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=11
FontWeight=700
AntiAlias=1
Text="MEMENTO MORI"
DynamicVariables=1

[MeterLiveClock]
Meter=String
MeasureName=MeasureTime
X=320
Y=16
StringAlign=Right
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=13
FontWeight=800
AntiAlias=1

[MeterCurrentDate]
Meter=String
MeasureName=MeasureDateString
X=320
Y=35
StringAlign=Right
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=8
AntiAlias=1

[MeterBoxDays]
Meter=Shape
Shape=Rectangle 20,58,145,65,8 | Fill Color #ColorCardBg# | Stroke Color #ColorBorder# | StrokeWidth 0.5

[MeterLabelDays]
Meter=String
X=30
Y=66
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=#FontSizeLabel#
FontWeight=600
AntiAlias=1
Text="DIAS VIVIDOS"

[MeterValueDays]
Meter=String
X=30
Y=82
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=#FontSizeValue#
FontWeight=800
AntiAlias=1
Text="#DaysLivedFormatted#"
DynamicVariables=1

[MeterBoxWeeks]
Meter=Shape
Shape=Rectangle 175,58,145,65,8 | Fill Color #ColorCardBg# | Stroke Color #ColorBorder# | StrokeWidth 0.5

[MeterLabelWeeks]
Meter=String
X=185
Y=66
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=#FontSizeLabel#
FontWeight=600
AntiAlias=1
Text="SEMANAS VIVIDAS"

[MeterValueWeeks]
Meter=String
X=185
Y=82
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=#FontSizeValue#
FontWeight=800
AntiAlias=1
Text="#WeeksLivedFormatted#"
DynamicVariables=1

[MeterBoxYearWeek]
Meter=Shape
Shape=Rectangle 20,133,300,42,8 | Fill Color #ColorCardBg# | Stroke Color #ColorBorder# | StrokeWidth 0.5

[MeterLabelYearWeek]
Meter=String
X=30
Y=140
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=#FontSizeLabel#
FontWeight=600
AntiAlias=1
Text="SEMANA DEL ANO"

[MeterValueYearWeek]
Meter=String
MeasureName=MeasureWeekOfYear
X=310
Y=139
StringAlign=Right
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=14
FontWeight=700
AntiAlias=1
Text="Semana %1 / 52"

[MeterLabelLifePct]
Meter=String
X=20
Y=184
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=#FontSizeSub#
FontWeight=600
AntiAlias=1
Text="PROGRESO DE VIDA (#TargetAge# ANOS EST.)"

[MeterValueLifePct]
Meter=String
X=320
Y=184
StringAlign=Right
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=#FontSizeSub#
FontWeight=700
AntiAlias=1
Text="#LifePctFormatted#"
DynamicVariables=1

[MeterLifeBarBg]
Meter=Shape
Shape=Rectangle 20,201,300,6,3 | Fill Color 40,45,60,255 | StrokeWidth 0

[MeterLifeBarFill]
Meter=Shape
Shape=Rectangle 20,201,(300 * #LifePctRaw#),6,3 | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1

[MeterFooter]
Meter=String
X=170
Y=220
StringAlign=Center
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=7.5
AntiAlias=1
Text="Clic derecho para opciones del widget"
