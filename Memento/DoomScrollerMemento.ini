[Rainmeter]
Update=30
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=Configurar Fecha de Nacimiento
ContextAction=["#@#Variables.inc"]
ContextTitle2=Refrescar Widget
ContextAction2=[!Refresh]
ContextTitle3=🌈 Activar Modo RGB Arcoiris
ContextAction3=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]
ContextTitle4=🎨 Color Naranja Dorado (Fijo)
ContextAction4=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,160,0,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,160,0,40" "#@#Variables.inc"][!RefreshApp]

[Metadata]
Name=DoomScroller Memento Mori Widget
Author=DoomScroller / Antigravity
Information=Widget Memento Mori con Reloj en Vivo y soporte RGB Chroma.
License=MIT
Version=3.3.0

[Variables]
@IncludeVariables=#@#Variables.inc
DaysLivedFormatted=0
WeeksLivedFormatted=0
HoursTo2100Formatted=0
DayOfYear=0
TotalDaysInYear=365
LifePctFormatted=0.0%
LifePctRaw=0.0

; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------

[MeasureRgbScript]
Measure=Script
ScriptFile=#@#rgb.lua

[MeasureMementoScript]
Measure=Script
ScriptFile=#@#memento.lua

[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureWeekOfYear]
Measure=Time
Format=%V

[MeasureDayOfYear]
Measure=Time
Format=%j

[MeasureDateString]
Measure=Time
Format=%d %b %Y
FormatLocale=es-ES

; -------------------------------------------------------------
; METERS
; -------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,340,268,14 | Fill Color #ColorBg# | Stroke Color #ColorBorder# | StrokeWidth 1
Shape2=Rectangle 15,14,310,2,1 | Fill Color #ColorAccentGlow# | StrokeWidth 0
DynamicVariables=1

[MeterHeaderTitle]
Meter=String
X=20
Y=16
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=11
FontWeight=700
AntiAlias=1
Text="MEMENTO MORI"
DynamicVariables=1

[MeterSub2100]
Meter=String
X=20
Y=35
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=8.5
FontWeight=600
AntiAlias=1
Text="#HoursTo2100Formatted# hrs al 2100"
InlineSetting=Color | #ColorTextPrimary#
InlinePattern=^[\d,]+
InlineSetting2=Weight | 800
InlinePattern2=^[\d,]+
DynamicVariables=1

[MeterLiveClock]
Meter=String
MeasureName=MeasureTime
X=320
Y=16
StringAlign=Right
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=13
FontWeight=800
AntiAlias=1

[MeterCurrentDate]
Meter=String
MeasureName=MeasureDateString
X=320
Y=35
StringAlign=Right
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=8
AntiAlias=1

[MeterBoxDays]
Meter=Shape
Shape=Rectangle 20,58,145,60,8 | Fill Color #ColorCardBg# | Stroke Color #ColorBorder# | StrokeWidth 0.5

[MeterLabelDays]
Meter=String
X=30
Y=65
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=#FontSizeLabel#
FontWeight=600
AntiAlias=1
Text="DIAS VIVIDOS"

[MeterValueDays]
Meter=String
X=30
Y=80
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=#FontSizeValue#
FontWeight=800
AntiAlias=1
Text="#DaysLivedFormatted#"
DynamicVariables=1

[MeterBoxWeeks]
Meter=Shape
Shape=Rectangle 175,58,145,60,8 | Fill Color #ColorCardBg# | Stroke Color #ColorBorder# | StrokeWidth 0.5

[MeterLabelWeeks]
Meter=String
X=185
Y=65
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=#FontSizeLabel#
FontWeight=600
AntiAlias=1
Text="SEMANAS VIVIDAS"

[MeterValueWeeks]
Meter=String
X=185
Y=80
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=#FontSizeValue#
FontWeight=800
AntiAlias=1
Text="#WeeksLivedFormatted#"
DynamicVariables=1

[MeterBoxYearWeek]
Meter=Shape
Shape=Rectangle 20,124,145,60,8 | Fill Color #ColorCardBg# | Stroke Color #ColorBorder# | StrokeWidth 0.5

[MeterLabelYearWeek]
Meter=String
X=30
Y=131
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=#FontSizeLabel#
FontWeight=600
AntiAlias=1
Text="SEMANA DEL ANO"

[MeterValueYearWeek]
Meter=String
MeasureName=MeasureWeekOfYear
X=30
Y=146
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=16
FontWeight=800
AntiAlias=1
Text="Sem. %1 / 52"

[MeterBoxDayOfYear]
Meter=Shape
Shape=Rectangle 175,124,145,60,8 | Fill Color #ColorCardBg# | Stroke Color #ColorBorder# | StrokeWidth 0.5

[MeterLabelDayOfYear]
Meter=String
X=185
Y=131
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=#FontSizeLabel#
FontWeight=600
AntiAlias=1
Text="DIA DEL ANO"

[MeterValueDayOfYear]
Meter=String
MeasureName=MeasureDayOfYear
X=185
Y=146
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=16
FontWeight=800
AntiAlias=1
Text="Dia %1 / #TotalDaysInYear#"
DynamicVariables=1

[MeterLabelLifePct]
Meter=String
X=20
Y=196
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=#FontSizeSub#
FontWeight=600
AntiAlias=1
Text="PROGRESO DE VIDA (#TargetAge# ANOS EST.)"

[MeterValueLifePct]
Meter=String
X=320
Y=196
StringAlign=Right
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=#FontSizeSub#
FontWeight=700
AntiAlias=1
Text="#LifePctFormatted#"
DynamicVariables=1

[MeterLifeBarBg]
Meter=Shape
Shape=Rectangle 20,215,300,6,3 | Fill Color 40,45,60,255 | StrokeWidth 0

[MeterLifeBarFill]
Meter=Shape
Shape=Rectangle 20,215,(300 * #LifePctRaw#),6,3 | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1

[MeterFooter]
Meter=String
X=170
Y=238
StringAlign=Center
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=7.5
AntiAlias=1
Text="Clic derecho para opciones del widget"
