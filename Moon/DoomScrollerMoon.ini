[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=Refrescar Fase Lunar
ContextAction=[!CommandMeasure MeasureMoonScript "Update()"][!Refresh]

[Metadata]
Name=DoomScroller Cosmic Moon HUD
Author=DoomScroller / Antigravity
Information=Widget cosmico de fase lunar en vivo con calculo astronomico dinamico y esfera interactiva.
License=MIT
Version=7.1.0

[Variables]
@IncludeVariables=#@#Variables.inc

MoonPhaseName=Calculando...
MoonIllumination=0%
MoonNextName=--
MoonNextDays=--
MoonIllumPct=50

; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------

[MeasureMoonScript]
Measure=Script
ScriptFile=#@#moon.lua

; -------------------------------------------------------------
; METERS (Diseno Cosmico Unico: Deep Midnight HUD - Ancho 240px)
; -------------------------------------------------------------

; FONDO COSMICO NOCTURNO (Deep Midnight Space Theme)
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,240,195,16 | Fill Color 8,12,24,245 | Stroke Color 140,170,230,60 | StrokeWidth 1
Shape2=Rectangle 15,14,210,2,1 | Fill Color 160,190,255,140 | StrokeWidth 0
DynamicVariables=1

; CABECERA COSMICA
[MeterHeaderTitle]
Meter=String
X=18
Y=18
FontColor=160,190,240,255
FontFace=#FontFamily#
FontSize=9
FontWeight=800
AntiAlias=1
Text="FASE LUNAR EN VIVO"
DynamicVariables=1

; ESFERA LUNAR DINAMICA CON NUCLEO DE ILUMINACION REAL
[MeterMoonSphere]
Meter=Shape
Shape=Ellipse 120,70,24 | Fill Color 12,18,32,255 | Stroke Color 160,190,255,120 | StrokeWidth 1.5
Shape2=Ellipse 120,70,(22 * Clamp(#MoonIllumPct#, 5, 100) / 100) | Fill Color 235,245,255,230 | StrokeWidth 0
Shape3=Ellipse 120,70,3 | Fill Color 255,255,255,255 | StrokeWidth 0
DynamicVariables=1

; NOMBRE DE FASE CENTRADO
[MeterMoonName]
Meter=String
X=120
Y=102
StringAlign=Center
W=220
ClipString=1
FontColor=245,248,255,255
FontFace=#FontFamily#
FontSize=10.5
FontWeight=800
AntiAlias=1
Text="#MoonPhaseName#"
DynamicVariables=1

; PORCENTAJE DE ILUMINACION
[MeterIllumText]
Meter=String
X=120
Y=118
StringAlign=Center
FontColor=160,200,255,255
FontFace=#FontFamily#
FontSize=8
FontWeight=700
AntiAlias=1
Text="ILUMINACIÓN: #MoonIllumination#"
DynamicVariables=1

; CARD INFERIOR PROXIMA FASE (Ancho Ampliado a 210px)
[MeterNextCard]
Meter=Shape
Shape=Rectangle 15,136,210,44,8 | Fill Color 18,26,42,220 | Stroke Color 140,170,230,35 | StrokeWidth 1
DynamicVariables=1

[MeterNextLabel]
Meter=String
X=24
Y=141
FontColor=130,150,180,255
FontFace=#FontFamily#
FontSize=7.5
FontWeight=800
AntiAlias=1
Text="PROXIMA FASE:"

[MeterNextValue]
Meter=String
X=24
Y=155
W=192
ClipString=1
FontColor=220,235,255,255
FontFace=#FontFamily#
FontSize=8.5
FontWeight=800
AntiAlias=1
Text="#MoonNextName# (en #MoonNextDays#)"
DynamicVariables=1
