[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=▶ Play / Pausa
ContextAction=[!CommandMeasure MeasurePomodoroScript "ToggleTimer()"]
ContextTitle2=⏭ Saltar Fase
ContextAction2=[!CommandMeasure MeasurePomodoroScript "SkipPhase()"]
ContextTitle3=🔄 Reiniciar Timer
ContextAction3=[!CommandMeasure MeasurePomodoroScript "ResetTimer()"]
ContextTitle4=⏱ Modo 25 / 5 min
ContextAction4=[!CommandMeasure MeasurePomodoroScript "SetMode25_5()"]
ContextTitle5=⏱ Modo 50 / 10 min
ContextAction5=[!CommandMeasure MeasurePomodoroScript "SetMode50_10()"]
ContextTitle6=🌈 Modo RGB Arcoiris
ContextAction6=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]
ContextTitle7=🎨 Color Naranja Dorado (Fijo)
ContextAction7=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,160,0,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,160,0,40" "#@#Variables.inc"][!RefreshApp]

[Metadata]
Name=DoomScroller Pomodoro Focus Timer Widget
Author=DoomScroller / Antigravity
Information=Widget Pomodoro minimalista para bloques de Enfoque Profundo y Dopamina.
License=MIT
Version=1.0.0

[Variables]
@IncludeVariables=#@#Variables.inc
PomoTimerFormatted=25:00
PomoStateText=ENFOQUE PROFUNDO
PomoBtnText=PLAY
PomoSessions=0
PomoProgressRaw=0.0000
PomoIsRunning=0

; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------

[MeasureRgbScript]
Measure=Script
ScriptFile=#@#rgb.lua

[MeasurePomodoroScript]
Measure=Script
ScriptFile=#@#pomodoro.lua

; -------------------------------------------------------------
; METERS
; -------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,230,115,14 | Fill Color #ColorBg# | Stroke Color #ColorBorder# | StrokeWidth 1
Shape2=Rectangle 15,12,200,2,1 | Fill Color #ColorAccentGlow# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasurePomodoroScript "ToggleTimer()"]
ToolTipText="Clic para Iniciar / Pausar | Clic derecho para opciones"
DynamicVariables=1

[MeterHeaderTitle]
Meter=String
X=20
Y=16
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=8.5
FontWeight=700
AntiAlias=1
Text="FOCUS POMODORO"
DynamicVariables=1

[MeterSessionsBadge]
Meter=String
X=210
Y=16
StringAlign=Right
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=8
FontWeight=600
AntiAlias=1
Text="#PomoSessions# Sesiones"
DynamicVariables=1

[MeterPomoClock]
Meter=String
X=20
Y=31
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=23
FontWeight=800
AntiAlias=1
Text="#PomoTimerFormatted#"
DynamicVariables=1

[MeterPlayPauseBtn]
Meter=String
X=208
Y=37
StringAlign=Right
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=11
FontWeight=800
AntiAlias=1
Text="#PomoBtnText#"
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasurePomodoroScript "ToggleTimer()"]

[MeterPomoState]
Meter=String
X=20
Y=67
FontColor=#ColorTextSecondary#
FontFace=#FontFamily#
FontSize=8
FontWeight=700
AntiAlias=1
Text="#PomoStateText#"
DynamicVariables=1

[MeterProgressBarBg]
Meter=Shape
Shape=Rectangle 20,87,190,5,2.5 | Fill Color 40,45,60,255 | StrokeWidth 0

[MeterProgressBarFill]
Meter=Shape
Shape=Rectangle 20,87,(190 * #PomoProgressRaw#),5,2.5 | Fill Color #ColorAccent# | StrokeWidth 0
DynamicVariables=1

[MeterFooterHint]
Meter=String
X=115
Y=98
StringAlign=Center
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=7
AntiAlias=1
Text="Clic para Iniciar / Pausar - Clic der opciones"
