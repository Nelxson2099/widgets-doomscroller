[Rainmeter]
Update=30
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=Refrescar Widget
ContextAction=[!Refresh]
ContextTitle2=🌈 Activar Modo RGB Arcoiris
ContextAction2=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]
ContextTitle3=🎨 Color Naranja Dorado (Fijo)
ContextAction3=[!WriteKeyValue Variables RgbMode "0" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccent "255,160,0,255" "#@#Variables.inc"][!WriteKeyValue Variables ColorAccentGlow "255,160,0,40" "#@#Variables.inc"][!RefreshApp]

[Metadata]
Name=DoomScroller UTC Clock Widget
Author=DoomScroller / Antigravity
Information=Widget minimalista para visualizar la Hora UTC en vivo.
License=MIT
Version=1.0.0

[Variables]
@IncludeVariables=#@#Variables.inc

; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------

[MeasureRgbScript]
Measure=Script
ScriptFile=#@#rgb.lua

[MeasureUtcTime]
Measure=Time
TimeZone=Z
Format=%H:%M:%S

[MeasureUtcDate]
Measure=Time
TimeZone=Z
Format=%d %b %Y
FormatLocale=es-ES

; -------------------------------------------------------------
; METERS
; -------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,210,80,12 | Fill Color #ColorBg# | Stroke Color #ColorBorder# | StrokeWidth 1
Shape2=Rectangle 12,10,186,2,1 | Fill Color #ColorAccentGlow# | StrokeWidth 0
DynamicVariables=1

[MeterHeaderTitle]
Meter=String
X=18
Y=16
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=8.5
FontWeight=700
AntiAlias=1
Text="HORA UTC (ZULU)"
DynamicVariables=1

[MeterUtcBadge]
Meter=String
X=192
Y=16
StringAlign=Right
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=7.5
FontWeight=600
AntiAlias=1
Text="UTC+0"

[MeterUtcClock]
Meter=String
MeasureName=MeasureUtcTime
X=18
Y=31
FontColor=#ColorTextPrimary#
FontFace=#FontFamily#
FontSize=20
FontWeight=800
AntiAlias=1

[MeterUtcDate]
Meter=String
MeasureName=MeasureUtcDate
X=18
Y=59
FontColor=#ColorTextMuted#
FontFace=#FontFamily#
FontSize=8
FontWeight=600
AntiAlias=1
