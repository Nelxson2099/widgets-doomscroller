[Rainmeter]
Update=16
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=Refrescar Visualizador
ContextAction=[!Refresh]
ContextTitle2=🌈 Activar Modo RGB Arcoiris
ContextAction2=[!WriteKeyValue Variables RgbMode "1" "#@#Variables.inc"][!RefreshApp]

[Metadata]
Name=DoomScroller Audio Visualizer
Author=DoomScroller / Antigravity
Information=Visualizador de audio reactivo en tiempo real con RGB Chroma.
License=MIT
Version=3.2.0

[Variables]
@IncludeVariables=#@#Variables.inc

; -------------------------------------------------------------
; MEASURES
; -------------------------------------------------------------

[MeasureRgbScript]
Measure=Script
ScriptFile=#@#rgb.lua

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=2048
FFTOverlap=1024
FFTAttack=15
FFTDecay=200
Bands=16
FreqMin=20
FreqMax=18000
Sensitivity=35

[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0

[MeasureBand1]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=1

