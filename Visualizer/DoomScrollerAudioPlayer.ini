[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,340,95,14 | Fill Color #ColorBg# | Stroke Color #ColorBorder# | StrokeWidth 1
Shape2=Rectangle 15,14,310,2,1 | Fill Color #ColorAccentGlow# | StrokeWidth 0
DynamicVariables=1

[MeterHeaderTitle]
Meter=String
X=20
Y=18
FontColor=#ColorAccent#
FontFace=#FontFamily#
FontSize=10
FontWeight=700
AntiAlias=1
Text="AUDIO VISUALIZER"
DynamicVariables=1

